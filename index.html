<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo AI — Unload Your Mind. Structured in Seconds.</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --surface-color: #161b22;
            --border-color: #30363d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #238636;
            --accent-danger: #f85149;
            --hover-bg: #21262d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* HEADER & NAVIGATION */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            width: 100%;
        }

        .logo-area h1 {
            font-size: 1.25rem;
            color: var(--accent-blue);
            font-weight: 700;
        }

        .user-nav {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-email {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: none;
        }

        @media (min-width: 600px) {
            .user-email {
                display: inline;
            }
        }

        .btn {
            background-color: var(--surface-color);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--hover-bg);
        }

        .btn-primary {
            background-color: var(--accent-green);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background-color: #2ea043;
        }

        .btn-danger {
            background-color: transparent;
            color: var(--accent-danger);
            border-color: var(--accent-danger);
        }

        .btn-danger:hover {
            background-color: rgba(248, 81, 73, 0.1);
        }

        /* MAIN RESPONSIVE LAYOUT */
        .app-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (min-width: 768px) {
            .app-container {
                flex-direction: row;
            }
        }

        /* SIDEBAR (Past Dumps) */
        sidebar {
            width: 100%;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            max-height: 250px;
            overflow-y: auto;
        }

        @media (min-width: 768px) {
            sidebar {
                width: 300px;
                border-bottom: none;
                border-right: 1px solid var(--border-color);
                max-height: none;
                height: calc(100vh - 61px);
            }
        }

        .sidebar-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h3 {
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        .history-list {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .history-item:hover {
            border-color: var(--accent-blue);
        }

        .history-item p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* WORKSPACE CONTENT AREA */
        .workspace {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 100%;
            overflow-x: hidden;
        }

        @media (min-width: 768px) {
            .workspace {
                padding: 30px;
            }
        }

        .input-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        @media (min-width: 768px) {
            .input-card {
                padding: 20px;
            }
        }

        .input-card textarea {
            width: 100%;
            min-height: 120px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
            resize: vertical;
        }

        .input-card textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .input-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* DASHBOARD RESULTS GRID */
        .results-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .results-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .result-box {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 180px;
        }

        .result-box h4 {
            font-size: 0.9rem;
            color: var(--accent-blue);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .card-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-item {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        /* AUTH MODAL OVERLAY */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .modal-card h2 {
            font-size: 1.3rem;
            color: var(--accent-blue);
            margin-bottom: 5px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .form-group input {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .modal-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 0.85rem;
        }

        .modal-footer a {
            color: var(--accent-blue);
            text-decoration: none;
            cursor: pointer;
        }

        .modal-footer a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo-area">
            <h1>Echo AI</h1>
        </div>
        <div class="user-nav">
            <span class="user-email" id="userEmailDisplay"></span>
            <button class="btn btn-danger hidden" id="logoutBtn" onclick="logoutUser()">Sign Out</button>
        </div>
    </header>

    <!-- MAIN APP CONTAINER -->
    <div class="app-container">
        <!-- SIDEBAR -->
        <sidebar>
            <div class="sidebar-header">
                <h3>Past Dumps</h3>
                <button class="btn" onclick="clearInput()">+ New Dump</button>
            </div>
            <div class="history-list" id="historyList">
                <div class="history-item"><p style="color: var(--text-secondary);">Loading history...</p></div>
            </div>
        </sidebar>

        <!-- WORKSPACE -->
        <div class="workspace">
            <div class="input-card">
                <textarea id="rawInputText" placeholder="Unload your mind here... Type thoughts, meetings, or tasks."></textarea>
                <div class="input-actions">
                    <span id="statusText" style="font-size: 0.8rem; color: var(--text-secondary);">Ready to process</span>
                    <button class="btn btn-primary" onclick="processDump()">Process with AI</button>
                </div>
            </div>

            <!-- RESULTS DASHBOARD -->
            <div class="results-grid">
                <div class="result-box">
                    <h4>📅 Calendar Events</h4>
                    <ul class="card-list" id="calendarList">
                        <li class="card-item" style="color: var(--text-secondary);">No events extracted yet.</li>
                    </ul>
                </div>
                <div class="result-box">
                    <h4>📝 Action Tasks</h4>
                    <ul class="card-list" id="tasksList">
                        <li class="card-item" style="color: var(--text-secondary);">No tasks extracted yet.</li>
                    </ul>
                </div>
                <div class="result-box">
                    <h4>💡 Ideas & Notes</h4>
                    <ul class="card-list" id="notesList">
                        <li class="card-item" style="color: var(--text-secondary);">No ideas saved yet.</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- AUTH MODAL -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-card">
            <h2 id="authModalTitle">Sign In to Echo AI</h2>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="authEmail" placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="authPassword" placeholder="••••••••">
            </div>
            <div class="form-group hidden" id="confirmPasswordGroup">
                <label>Confirm Password</label>
                <input type="password" id="authConfirmPassword" placeholder="••••••••">
            </div>
            <p id="authErrorMsg" style="color: var(--accent-danger); font-size: 0.8rem;"></p>
            <button class="btn btn-primary" style="width: 100%; padding: 10px;" id="authSubmitBtn" onclick="handleAuthSubmit()">Sign In</button>
            <div class="modal-footer">
                <a id="authSwitchToggle" onclick="toggleAuthMode()">Don't have an account? Sign Up</a>
                <a onclick="triggerForgotPassword()">Forgot Password?</a>
            </div>
        </div>
    </div>

    <script>
        let isSignUpMode = false;

        window.addEventListener("DOMContentLoaded", () => {
            checkAuth();
            loadHistory();
        });

        async function checkAuth() {
            try {
                const res = await fetch("/api/me");
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById("userEmailDisplay").innerText = data.email;
                    document.getElementById("logoutBtn").classList.remove("hidden");
                    document.getElementById("authModal").classList.add("hidden");
                } else {
                    document.getElementById("authModal").classList.remove("hidden");
                }
            } catch (err) {
                console.error("Auth check failed", err);
            }
        }

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            const title = document.getElementById("authModalTitle");
            const submitBtn = document.getElementById("authSubmitBtn");
            const toggle = document.getElementById("authSwitchToggle");
            const confirmGroup = document.getElementById("confirmPasswordGroup");

            if (isSignUpMode) {
                title.innerText = "Create Echo AI Account";
                submitBtn.innerText = "Sign Up";
                toggle.innerText = "Already have an account? Sign In";
                confirmGroup.classList.remove("hidden");
            } else {
                title.innerText = "Sign In to Echo AI";
                submitBtn.innerText = "Sign In";
                toggle.innerText = "Don't have an account? Sign Up";
                confirmGroup.classList.add("hidden");
            }
        }

        async function handleAuthSubmit() {
            const email = document.getElementById("authEmail").value;
            const password = document.getElementById("authPassword").value;
            const errorMsg = document.getElementById("authErrorMsg");
            errorMsg.innerText = "";

            let endpoint = "/api/login";
            let payload = { email, password };

            if (isSignUpMode) {
                endpoint = "/api/register";
                const confirm_password = document.getElementById("authConfirmPassword").value;
                payload.confirm_password = confirm_password;
            }

            try {
                const res = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (res.ok) {
                    window.location.reload();
                } else {
                    errorMsg.innerText = data.detail || "Authentication failed.";
                }
            } catch (err) {
                errorMsg.innerText = "Network error. Please try again.";
            }
        }

        async function logoutUser() {
            await fetch("/api/logout", { method: "POST" });
            window.location.reload();
        }

        async function processDump() {
            const raw_text = document.getElementById("rawInputText").value;
            if (!raw_text.trim()) return;

            document.getElementById("statusText").innerText = "Processing with AI...";
            try {
                const res = await fetch("/parse-voice-dump", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ raw_text })
                });
                if (res.ok) {
                    const data = await res.json();
                    renderResults(data);
                    document.getElementById("statusText").innerText = "Processed successfully!";
                    loadHistory();
                } else {
                    document.getElementById("statusText").innerText = "Error processing dump.";
                }
            } catch (err) {
                document.getElementById("statusText").innerText = "Network error.";
            }
        }

        function renderResults(data) {
            const calList = document.getElementById("calendarList");
            const taskList = document.getElementById("tasksList");
            const noteList = document.getElementById("notesList");

            calList.innerHTML = "";
            taskList.innerHTML = "";
            noteList.innerHTML = "";

            if (data.calendar_events && data.calendar_events.length > 0) {
                data.calendar_events.forEach(ev => {
                    calList.innerHTML += `<li class="card-item"><strong>${ev.title}</strong><br><span style="color:var(--text-secondary);font-size:0.75rem;">${ev.day_or_date} @ ${ev.time}</span></li>`;
                });
            } else {
                calList.innerHTML = `<li class="card-item" style="color: var(--text-secondary);">No events found.</li>`;
            }

            if (data.tasks && data.tasks.length > 0) {
                data.tasks.forEach(t => {
                    taskList.innerHTML += `<li class="card-item"><strong>${t.task}</strong><br><span style="color:var(--text-secondary);font-size:0.75rem;">Priority: ${t.priority}</span></li>`;
                });
            } else {
                taskList.innerHTML = `<li class="card-item" style="color: var(--text-secondary);">No tasks found.</li>`;
            }

            if (data.ideas_and_notes && data.ideas_and_notes.length > 0) {
                data.ideas_and_notes.forEach(n => {
                    noteList.innerHTML += `<li class="card-item"><strong>${n.category}</strong>: ${n.summary}</li>`;
                });
            } else {
                noteList.innerHTML = `<li class="card-item" style="color: var(--text-secondary);">No notes found.</li>`;
            }
        }

        async function loadHistory() {
            try {
                const res = await fetch("/history");
                if (res.ok) {
                    const history = await res.json();
                    const list = document.getElementById("historyList");
                    list.innerHTML = "";
                    if (history.length === 0) {
                        list.innerHTML = `<div class="history-item"><p>No past dumps yet.</p></div>`;
                        return;
                    }
                    history.forEach(item => {
                        list.innerHTML += `
                            <div class="history-item" onclick='loadDumpDetails(${JSON.stringify(item.parsed_data).replace(/'/g, "&apos;")})'>
                                <p><strong>${new Date(item.created_at).toLocaleDateString()}</strong></p>
                                <p>${item.raw_text}</p>
                            </div>
                        `;
                    });
                }
            } catch (err) {
                console.error("Failed to load history");
            }
        }

        function loadDumpDetails(parsedData) {
            renderResults(parsedData);
        }

        function clearInput() {
            document.getElementById("rawInputText").value = "";
            document.getElementById("statusText").innerText = "Ready to process";
        }

        async function triggerForgotPassword() {
            const email = document.getElementById("authEmail").value;
            if (!email) {
                alert("Please enter your email address in the email field first.");
                return;
            }
            try {
                const res = await fetch("/api/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                alert(data.message);
            } catch (err) {
                alert("Failed to send reset request.");
            }
        }
    </script>
</body>
</html>
