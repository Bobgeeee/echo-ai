<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Echo AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            text-align: center;
            color: #58a6ff;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: #8b949e;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.8rem;
            color: #8b949e;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        input {
            background-color: #0d1117;
            border: 1px solid #30363d;
            padding: 10px 38px 10px 10px;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 0.9rem;
            width: 100%;
            outline: none;
        }

        input:focus {
            border-color: #58a6ff;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            cursor: pointer;
            color: #8b949e;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }

        .toggle-password:hover {
            color: #58a6ff;
        }

        .toggle-password svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .hint {
            font-size: 0.75rem;
            color: #8b949e;
            margin-top: 2px;
        }

        button.btn-submit {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: none;
            background-color: #238636;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.2s;
        }

        button.btn-submit:hover {
            background-color: #2ea043;
        }

        #status-message {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.85rem;
            padding: 8px;
            border-radius: 6px;
            display: none;
        }

        .status-success {
            display: block !important;
            background-color: rgba(35, 134, 54, 0.15);
            color: #4ade80;
            border: 1px solid rgba(35, 134, 54, 0.3);
        }

        .status-error {
            display: block !important;
            background-color: rgba(248, 81, 73, 0.15);
            color: #f85149;
            border: 1px solid rgba(248, 81, 73, 0.3);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Set New Password</h2>
        <p class="subtitle">Enter your new secure password below.</p>

        <form id="reset-form">
            <div class="form-group">
                <label for="new-password">New Password</label>
                <div class="input-container">
                    <input type="password" id="new-password" required placeholder="••••••••">
                    <button type="button" class="toggle-password" onclick="toggleVisibility('new-password', this)">
                        <svg class="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
                <div class="hint">Must be at least 8 characters long.</div>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <div class="input-container">
                    <input type="password" id="confirm-password" required placeholder="••••••••">
                    <button type="button" class="toggle-password" onclick="toggleVisibility('confirm-password', this)">
                        <svg class="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit">Update Password</button>
        </form>

        <div id="status-message"></div>
    </div>

    <script>
        function toggleVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const isPassword = input.type === "password";
            input.type = isPassword ? "text" : "password";

            if (isPassword) {
                btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
            } else {
                btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
            }
        }

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('status-message');
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                msg.className = 'status-error';
                msg.textContent = 'Invalid or missing reset token. Please request a new link.';
                return;
            }

            if (newPassword.length < 8) {
                msg.className = 'status-error';
                msg.textContent = 'Password must be at least 8 characters long.';
                return;
            }

            if (newPassword !== confirmPassword) {
                msg.className = 'status-error';
                msg.textContent = 'Passwords do not match.';
                return;
            }

            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, new_password: newPassword })
                });

                const data = await res.json();

                if (res.ok) {
                    msg.className = 'status-success';
                    msg.textContent = 'Password successfully reset! Redirecting to login...';
                    setTimeout(() => window.location.href = '/', 2500);
                } else {
                    msg.className = 'status-error';
                    msg.textContent = data.detail || 'Reset failed. Token may be expired.';
                }
            } catch (err) {
                msg.className = 'status-error';
                msg.textContent = 'Server connection error. Please try again later.';
            }
        });
    </script>
</body>
</html>
