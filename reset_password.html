<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Echo AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0f17;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .card {
            background-color: #131c2e;
            border: 1px solid #1e2d4a;
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            text-align: center;
            color: #38bdf8;
        }

        p.subtitle {
            font-size: 0.875rem;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
            position: relative;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 0.4rem;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 0.75rem 2.5rem 0.75rem 0.85rem;
            border-radius: 8px;
            border: 1px solid #2a3b5c;
            background-color: #0b1324;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #38bdf8;
        }

        .toggle-password {
            position: absolute;
            right: 0.75rem;
            cursor: pointer;
            background: none;
            border: none;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.25rem;
        }

        .toggle-password:hover {
            color: #38bdf8;
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .hint {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 0.3rem;
        }

        button.btn-submit {
            width: 100%;
            padding: 0.8rem;
            border-radius: 8px;
            border: none;
            background-color: #0284c7;
            color: #ffffff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background 0.2s;
        }

        button.btn-submit:hover {
            background-color: #0369a1;
        }

        #status-message {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.875rem;
            padding: 0.5rem;
            border-radius: 6px;
            display: none;
        }

        .status-success {
            display: block !important;
            background-color: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status-error {
            display: block !important;
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Reset Your Password</h2>
        <p class="subtitle">Enter your new secure password below.</p>

        <form id="reset-form">
            <div class="form-group">
                <label for="new-password">New Password</label>
                <div class="input-container">
                    <input type="password" id="new-password" required minlength="8" placeholder="Enter new password">
                    <button type="button" class="toggle-password" onclick="toggleVisibility('new-password', this)">
                        <svg class="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
                <div class="hint">Must be at least 8 characters long.</div>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <div class="input-container">
                    <input type="password" id="confirm-password" required minlength="8" placeholder="Confirm new password">
                    <button type="button" class="toggle-password" onclick="toggleVisibility('confirm-password', this)">
                        <svg class="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit">Update Password</button>
        </form>

        <div id="status-message"></div>
    </div>

    <script>
        // Toggle password visibility (Show / Hide)
        function toggleVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const isPassword = input.type === "password";
            input.type = isPassword ? "text" : "password";

            // Update SVG Icon (Eye vs Eye Off)
            if (isPassword) {
                btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
            } else {
                btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
            }
        }

        // Form Submit Handler
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('status-message');
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // Extract token from URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                msg.className = 'status-error';
                msg.textContent = 'Invalid or missing reset token. Please request a new link.';
                return;
            }

            if (newPassword.length < 8) {
                msg.className = 'status-error';
                msg.textContent = 'Password must be at least 8 characters long.';
                return;
            }

            if (newPassword !== confirmPassword) {
                msg.className = 'status-error';
                msg.textContent = 'Passwords do not match.';
                return;
            }

            try {
                const res = await fetch('/api/reset-password-confirm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, new_password: newPassword })
                });

                const data = await res.json();

                if (res.ok) {
                    msg.className = 'status-success';
                    msg.textContent = 'Password successfully reset! Redirecting to login...';
                    setTimeout(() => window.location.href = '/', 2500);
                } else {
                    msg.className = 'status-error';
                    msg.textContent = data.detail || 'Reset failed. Token may be expired.';
                }
            } catch (err) {
                msg.className = 'status-error';
                msg.textContent = 'Server connection error. Please try again later.';
            }
        });
    </script>
</body>
</html>
